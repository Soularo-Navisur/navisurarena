<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon espace client — Riviera Marine Assurances</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0f1e3c; --gold:#c9a84c; }
    body {
      font-family:'DM Sans',sans-serif;
      background: linear-gradient(135deg, #0f1e3c 0%, #1a2e5a 60%, #0f1e3c 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .login-box {
      background:white; border-radius:20px; padding:48px 40px;
      width:100%; max-width:420px;
      box-shadow:0 24px 80px rgba(0,0,0,.3);
    }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo .brand { font-family:'Playfair Display',serif; font-size:22px; font-weight:900; color:var(--navy); }
    .login-logo .sub   { font-size:12px; color:#64748b; text-transform:uppercase; letter-spacing:.1em; margin-top:4px; }
    .login-logo .icon  { font-size:42px; margin-bottom:8px; }
    h2 { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--navy); margin-bottom:24px; }
    .form-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#64748b; }
    .form-control {
      border-radius:10px; border:1.5px solid #e2e8f0; padding:11px 14px;
      font-size:14px; transition:border-color .2s;
    }
    .form-control:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,168,76,.12); }
    .btn-login {
      background:linear-gradient(135deg,#c9a84c,#e6c97a,#c9a84c);
      background-size:200% 100%; background-position:right center;
      color:#0f1e3c; border:none; border-radius:10px; padding:12px;
      font-weight:700; font-size:14px; width:100%;
      transition:all .25s; cursor:pointer;
    }
    .btn-login:hover { background-position:left center; transform:translateY(-1px); }
    .error-box {
      background:rgba(220,38,38,.08); border:1px solid rgba(220,38,38,.25);
      border-radius:10px; padding:12px 16px; color:#dc2626;
      font-size:13px; margin-bottom:20px;
    }
    .footer-note { text-align:center; margin-top:24px; font-size:12px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">⛵</div>
      <div class="brand">Riviera Marine Assurances</div>
      <div class="sub">Espace client</div>
    </div>

    <h2>Connexion</h2>

    {% if error %}
    <div class="error-box"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="on">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control"
               placeholder="votre@email.fr" required autofocus autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label">Mot de passe</label>
        <input type="password" name="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Se connecter →</button>
    </form>

    <div class="footer-note">
      Problème de connexion ? Contactez votre courtier.<br>
      <a href="mailto:contact@rivieramarine-assurances.fr" style="color:var(--gold)">contact@rivieramarine-assurances.fr</a>
    </div>
  </div>
</body>
</html>
