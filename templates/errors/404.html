<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Page introuvable — NAVISUR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f0f4f8; font-family:'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .error-box { background:white; border-radius:16px; padding:48px 56px; text-align:center; max-width:520px; box-shadow:0 8px 40px rgba(26,46,90,.1); }
  .error-code { font-size:96px; font-weight:800; color:#1a2e5a; line-height:1; margin-bottom:8px; }
  .error-anchor { width:60px; height:4px; background:#c9a84c; border-radius:2px; margin:16px auto; }
  h1 { font-size:22px; font-weight:700; color:#1a2e5a; margin-bottom:12px; }
  p { color:#64748b; margin-bottom:32px; line-height:1.6; }
  .btn-home { background:#1a2e5a; color:white; padding:12px 32px; border-radius:8px; text-decoration:none; font-weight:600; display:inline-block; }
  .btn-home:hover { background:#c9a84c; color:#1a2e5a; }
</style>
</head>
<body>
<div class="error-box">
  <div class="error-code">404</div>
  <div class="error-anchor"></div>
  <h1>⚓ Page introuvable</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée.<br>
     Vérifiez l'adresse ou revenez à l'accueil.</p>
  <a href="/" class="btn-home">← Retour à l'accueil</a>
</div>
</body>
</html>
